<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="280" viewBox="0 0 860 280" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#444"/>
    </marker>
  </defs>

  <text x="430" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">Updating IronSide TE</text>

  <!-- Input -->
  <rect x="20" y="115" width="150" height="60" rx="6" fill="#ffffff" stroke="#5a4fa0" stroke-width="1.5"/>
  <text x="95" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#3d3577">Signed bundle</text>
  <text x="95" y="157" text-anchor="middle" font-size="10" fill="#555">ironside-te.iron.zip</text>

  <!-- Without a full erase -->
  <text x="335" y="58" text-anchor="middle" font-size="11" font-weight="bold" fill="#444">To change UROT or IronSide DFU</text>
  <rect x="230" y="66" width="210" height="64" rx="6" fill="#ffffff" stroke="#5a4fa0" stroke-width="1.5"/>
  <text x="335" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#3d3577">Update without a full erase</text>
  <text x="335" y="105" text-anchor="middle" font-size="10" fill="#555">ironside_update.py</text>
  <text x="335" y="120" text-anchor="middle" font-size="10" fill="#555">--component urot|dfu</text>

  <rect x="510" y="66" width="330" height="64" rx="6" fill="#f7f7f7" stroke="#888" stroke-width="1.5"/>
  <text x="675" y="92" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">Device keeps its state</text>
  <text x="675" y="110" text-anchor="middle" font-size="10" fill="#555">keys, base configuration, application, and lifecycle state</text>

  <!-- With a full erase -->
  <text x="335" y="168" text-anchor="middle" font-size="11" font-weight="bold" fill="#444">To change IROT, base configuration, or keyset</text>
  <rect x="230" y="176" width="210" height="64" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="335" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#8e2a20">Reinstall with a full erase</text>
  <text x="335" y="215" text-anchor="middle" font-size="10" fill="#555">ironside_install.py --force</text>
  <text x="335" y="230" text-anchor="middle" font-size="10" fill="#555">add --keyset if protected</text>

  <rect x="510" y="176" width="330" height="64" rx="6" fill="#f7f7f7" stroke="#888" stroke-width="1.5"/>
  <text x="675" y="202" text-anchor="middle" font-size="12" font-weight="bold" fill="#444">Device is erased and reinstalled</text>
  <text x="675" y="220" text-anchor="middle" font-size="10" fill="#555">Open lifecycle state; install the application again</text>

  <!-- Arrows -->
  <line x1="170" y1="135" x2="228" y2="100" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="170" y1="155" x2="228" y2="205" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440" y1="98" x2="508" y2="98" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="440" y1="208" x2="508" y2="208" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
