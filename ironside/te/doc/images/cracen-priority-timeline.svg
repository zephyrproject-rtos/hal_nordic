    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="560" fill="#ffffff"/>
  <text x="470" y="28" text-anchor="middle" font-size="17" font-weight="bold" fill="#222222">A call from a level-6 handler: CRACEN at secure 6</text>
  <rect x="10" y="70" width="920" height="62" rx="0" fill="#f7f7f7" stroke="none" stroke-width="0"/>
  <text x="246" y="99" text-anchor="end" font-size="12" fill="#23507f" font-weight="bold">NS interrupt, level 2</text>
  <text x="246" y="114" text-anchor="end" font-size="11" fill="#666">secure 5</text>
